name: Build, test, render & publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: font-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build, test & render every character
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements.txt
      - name: Build TTF and WOFF2
        run: python scripts/build.py
      - name: Sanitize both font formats
        run: python scripts/sanitize.py
      - name: Render the complete Unicode character set
        run: python scripts/specimen.py
      - name: Build licensed package and specimen site
        run: python scripts/package.py
      - name: Run release acceptance tests
        run: python -m pytest -q
      - name: Verify reproducible binaries and committed sources
        run: |
          python scripts/check_reproducible.py
          git diff --exit-code -- fonts/ sources/svg/ sources/features.fea
      - name: Upload fonts, complete atlas and coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: font-and-specimens
          path: |
            fonts/
            specimen/
            OFL.txt
            FONTLOG.txt
            docs/OFL-FAQ.txt
          retention-days: 30
      - name: Upload release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: build/
      - name: Upload specimen site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/
  pages:
    name: Publish verified specimen
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  release:
    name: Publish licensed preview release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: build/
      - name: Verify tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -f "build/TalynBrush-${RELEASE_TAG}.zip"
          gh release create "$RELEASE_TAG" "build/TalynBrush-${RELEASE_TAG}.zip" build/SHA256SUMS.txt --verify-tag --prerelease --title "Talyn Brush 0.400: consistent brush weight preview" --notes-file docs/RELEASE.md
