name: Build, test, render & publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: font-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build, test & render every character
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements.txt
      - name: Build TTF and WOFF2
        run: python scripts/build.py
      - name: Sanitize both font formats
        run: python scripts/sanitize.py
      - name: Render the complete Unicode character set
        run: python scripts/specimen.py
      - name: Build licensed package and specimen site
        run: python scripts/package.py
      - name: Run release acceptance tests
        run: python -m pytest -q
      - name: Verify reproducible binaries and committed sources
        run: |
          python scripts/check_reproducible.py
          git diff --exit-code -- fonts/ sources/svg/ sources/features.fea
      - name: Upload fonts, complete atlas and coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: font-and-specimens
          path: |
            fonts/
            specimen/
            OFL.txt
            FONTLOG.txt
            docs/OFL-FAQ.txt
          retention-days: 30
      - name: Upload release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package
          path: build/
      - name: Upload specimen site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/
  pages:
    name: Publish verified specimen
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  release:
    name: Publish licensed preview release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-package
          path: build/
      - name: Verify tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -f "build/TalynBrush-${RELEASE_TAG}.zip"
          gh release create "$RELEASE_TAG" "build/TalynBrush-${RELEASE_TAG}.zip" build/SHA256SUMS.txt --verify-tag --prerelease --title "Talyn Brush 0.100 — Mongolian Cyrillic preview" --notes-file docs/RELEASE.md
